AWSTemplateFormatVersion: '2010-09-09'
Description: DBuff - Dota 2 match analytics backend on AWS

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: >-
      Password for the dbuffuser role in the PostgreSQL instance running on the
      app server. Must not contain a single quote - it is interpolated into a
      SQL literal in UserData.

  DotaApiKey:
    Type: String
    NoEcho: true
    Description: OpenDota API key

  ScrapperApiKey:
    Type: String
    NoEcho: true
    Description: ScraperAPI key

  OpenAiApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key

  DiscordBotToken:
    Type: String
    NoEcho: true
    Description: Discord bot token

  GoogleVisionCredentialsB64:
    Type: String
    NoEcho: true
    Description: Base64-encoded Google Vision service-account JSON key

  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium]
    Description: >-
      EC2 instance type (Graviton/arm64 only - the AMI below is arm64).
      t4g.small (2 GiB) runs the app plus Postgres with ~600 MB headroom.
      Step up to t4g.medium (4 GiB) only if swap usage is sustained.

  AllowedSshCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed for SSH access

# ---------- VPC ----------
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: dbuff-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: dbuff-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # --- Public Subnets ---
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: dbuff-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: dbuff-public-2

  # --- Route Tables ---
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: dbuff-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ---------- Security Groups ----------
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DBuff application server
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: Spring Boot application
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: dbuff-app-sg

  # ---------- SSM Parameter Store ----------
  SsmDotaApiKey:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dbuff/DOTA_API_KEY
      Type: String
      Value: !Ref DotaApiKey
      Description: OpenDota API key

  SsmScrapperApiKey:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dbuff/SCRAPPER_API_KEY
      Type: String
      Value: !Ref ScrapperApiKey
      Description: ScraperAPI key

  SsmOpenAiApiKey:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dbuff/OPENAI_API_KEY
      Type: String
      Value: !Ref OpenAiApiKey
      Description: OpenAI API key

  SsmDiscordBotToken:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dbuff/DISCORD_BOT_TOKEN
      Type: String
      Value: !Ref DiscordBotToken
      Description: Discord bot token

  SsmGoogleVisionCredentials:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dbuff/GOOGLE_VISION_CREDENTIALS_B64
      Type: String
      Value: !Ref GoogleVisionCredentialsB64
      Description: Base64-encoded Google Vision service-account JSON key

  # ---------- S3 Bucket ----------
  # The deploy bucket is created by deploy.sh on first upload.
  # We reference it by name in IAM policies and UserData.

  # ---------- IAM ----------
  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dbuff-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: dbuff-ssm-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dbuff/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::dbuff-deploy-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::dbuff-deploy-${AWS::AccountId}/*'
              # Nightly pg_dump upload; replaces RDS automated backups.
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:aws:s3:::dbuff-deploy-${AWS::AccountId}/db-backups/*'

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: dbuff-ec2-profile
      Roles:
        - !Ref Ec2Role

  # ---------- EC2 ----------
  ElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: dbuff-eip

  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn: VPCGatewayAttachment
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      IamInstanceProfile: !Ref Ec2InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            # 40 GB: OS + JAR + Postgres data + 2 GB swapfile + room to grow.
            # gp3 includes 3000 IOPS / 125 MB-s at any size, matching what the
            # 20 GB RDS volume provided, so there is no IO regression.
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/user-data.log 2>&1

          # Install Amazon Corretto 21
          dnf install -y java-21-amazon-corretto-headless

          # Install CloudWatch agent
          dnf install -y amazon-cloudwatch-agent
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'CWEOF'
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/dbuff/dbuff.log",
                      "log_group_name": "/aws/ec2/dbuff",
                      "log_stream_name": "{instance_id}/app",
                      "retention_in_days": 30
                    },
                    {
                      "file_path": "/var/log/user-data.log",
                      "log_group_name": "/aws/ec2/dbuff",
                      "log_stream_name": "{instance_id}/user-data",
                      "retention_in_days": 30
                    }
                  ]
                }
              }
            }
          }
          CWEOF
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config -m ec2 \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

          # ---------- Swap ----------
          # 2 GiB safety net. RAM budget on t4g.small is ~1.4 GB of 2 GB, so swap
          # should stay near-empty; sustained usage means resize the instance.
          dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          echo 'vm.swappiness=10' > /etc/sysctl.d/99-dbuff-swap.conf
          sysctl -p /etc/sysctl.d/99-dbuff-swap.conf

          # ---------- PostgreSQL 16 ----------
          dnf install -y postgresql16-server postgresql16
          /usr/bin/postgresql-setup --initdb

          # Tuning for 2 GiB shared with the JVM. Appended rather than edited in
          # place: in postgresql.conf the last occurrence of a setting wins.
          cat >> /var/lib/pgsql/data/postgresql.conf <<'PGCONF'

          # --- dbuff tuning ---
          listen_addresses = 'localhost'
          max_connections = 30
          shared_buffers = 256MB
          effective_cache_size = 768MB
          maintenance_work_mem = 64MB
          work_mem = 8MB
          wal_compression = on
          checkpoint_completion_target = 0.9
          # SSD-backed gp3: random reads cost about the same as sequential
          random_page_cost = 1.1
          effective_io_concurrency = 200
          # Trades up to ~200ms of committed transactions on an unclean shutdown
          # for better write throughput. Set to 'on' if that is unacceptable.
          synchronous_commit = off
          log_min_duration_statement = 2000
          PGCONF

          # The AL2023 default pg_hba uses 'ident' for TCP loopback, which fails
          # for the 'dbuff' OS user connecting as role 'dbuffuser'. The app uses
          # jdbc:postgresql://localhost, i.e. a TCP connection, so this must be
          # password auth or the application cannot start.
          sed -i -E 's|^(host[[:space:]]+all[[:space:]]+all[[:space:]]+127\.0\.0\.1/32[[:space:]]+).*|\1scram-sha-256|' /var/lib/pgsql/data/pg_hba.conf
          sed -i -E 's|^(host[[:space:]]+all[[:space:]]+all[[:space:]]+::1/128[[:space:]]+).*|\1scram-sha-256|' /var/lib/pgsql/data/pg_hba.conf
          grep -E '^host' /var/lib/pgsql/data/pg_hba.conf

          systemctl enable --now postgresql

          # Create the application role and database idempotently, so replacing
          # the instance against an existing volume does not fail the boot.
          # Quoted heredoc: CloudFormation substitutes the password parameter
          # first, and the quoting then stops the shell expanding any $ or
          # backtick in it. A single quote in the password would still break this
          # SQL - see the DB_PASSWORD note in deploy.sh usage. Note that this
          # comment deliberately avoids writing CloudFormation's parameter
          # reference syntax: Fn::Sub rewrites comments too, so spelling it out
          # here would interpolate the secret into a comment in the boot log.
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQLEOF'
          SELECT 'CREATE ROLE dbuffuser LOGIN'
            WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'dbuffuser')\gexec
          SELECT 'CREATE DATABASE dbuff OWNER dbuffuser'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'dbuff')\gexec
          ALTER ROLE dbuffuser LOGIN PASSWORD '${DbPassword}';
          SQLEOF

          # Fetch secrets from SSM Parameter Store
          REGION=${AWS::Region}
          DOTA_API_KEY=$(aws ssm get-parameter --name /dbuff/DOTA_API_KEY --region $REGION --query 'Parameter.Value' --output text)
          SCRAPPER_API_KEY=$(aws ssm get-parameter --name /dbuff/SCRAPPER_API_KEY --region $REGION --query 'Parameter.Value' --output text)
          OPENAI_API_KEY=$(aws ssm get-parameter --name /dbuff/OPENAI_API_KEY --region $REGION --query 'Parameter.Value' --output text)
          DISCORD_BOT_TOKEN=$(aws ssm get-parameter --name /dbuff/DISCORD_BOT_TOKEN --region $REGION --query 'Parameter.Value' --output text)
          GOOGLE_VISION_CREDENTIALS_B64=$(aws ssm get-parameter --name /dbuff/GOOGLE_VISION_CREDENTIALS_B64 --region $REGION --query 'Parameter.Value' --output text)

          # Prepare directories
          mkdir -p /opt/dbuff /var/log/dbuff
          useradd -r -s /sbin/nologin dbuff || true
          chown dbuff:dbuff /opt/dbuff /var/log/dbuff

          # ---------- Nightly backup ----------
          # Replaces RDS automated backups. Retention is an S3 lifecycle rule on
          # the db-backups/ prefix, not this script's problem.
          # Quoted heredoc, so the shell does not expand $STAMP/$TMP when writing
          # the file - but CloudFormation still substitutes its own parameter
          # references here, which is how the bucket and region get baked in.
          # Consequence: do not use brace-delimited shell variables in this
          # block, because Fn::Sub would try to resolve them as template
          # references and fail the deploy. Bare $NAME is safe; $NAME in braces
          # is not.
          cat > /usr/local/bin/dbuff-backup.sh <<'BKEOF'
          #!/bin/bash
          set -euo pipefail
          BUCKET="dbuff-deploy-${AWS::AccountId}"
          REGION="${AWS::Region}"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          TMP=$(mktemp /tmp/dbuff-XXXXXX.dump)
          trap 'rm -f "$TMP"' EXIT
          # Runs as root, switches to the postgres OS user so peer auth applies
          # and no password needs to live on disk. -Fc already zlib-compresses,
          # so there is nothing to gain by piping through gzip. The redirect is
          # done by this root shell rather than pg_dump's -f, because mktemp made
          # the file root-owned 0600 and the postgres user could not open it.
          sudo -u postgres pg_dump -Fc -d dbuff > "$TMP"
          # Cheap integrity gate: a truncated dump fails to list. Upload only a
          # dump we know is readable, so S3 never holds a corrupt file that looks
          # like a valid backup.
          pg_restore --list "$TMP" > /dev/null
          aws s3 cp "$TMP" "s3://$BUCKET/db-backups/dbuff-$STAMP.dump" --region "$REGION"
          echo "backup complete: dbuff-$STAMP.dump ($(du -h "$TMP" | cut -f1))"
          BKEOF
          chmod 755 /usr/local/bin/dbuff-backup.sh

          cat > /etc/systemd/system/dbuff-backup.service <<'BKSVC'
          [Unit]
          Description=DBuff nightly database backup to S3
          After=postgresql.service
          Requires=postgresql.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/dbuff-backup.sh
          StandardOutput=append:/var/log/dbuff/backup.log
          StandardError=append:/var/log/dbuff/backup.log
          BKSVC

          cat > /etc/systemd/system/dbuff-backup.timer <<'BKTMR'
          [Unit]
          Description=Run the DBuff database backup nightly

          [Timer]
          # 02:30 UTC, inside the app's configured quiet hours (01:00-09:00)
          OnCalendar=*-*-* 02:30:00
          Persistent=true

          [Install]
          WantedBy=timers.target
          BKTMR

          systemctl daemon-reload
          systemctl enable --now dbuff-backup.timer
          # Run the backup once at boot, to smoke-test pg_dump and the
          # s3:PutObject grant now rather than discovering a broken backup at
          # 02:30 the following morning. This explicit trigger is required:
          # Persistent=true only replays a run the timer *missed*, and on a
          # first-ever enable systemd stamps the timer as though it had just
          # run, so nothing fires until the next OnCalendar match. Learned the
          # hard way - after the first boot of this instance, backup.log did not
          # exist. Tolerates failure because a fresh instance has an empty
          # database and a backup must never block the boot.
          systemctl start dbuff-backup.service || true

          # Write the Google Vision service-account key (skip if not provided)
          GOOGLE_VISION_CREDENTIALS_PATH=/opt/dbuff/google-vision.json
          if [ -n "$GOOGLE_VISION_CREDENTIALS_B64" ]; then
            echo "$GOOGLE_VISION_CREDENTIALS_B64" | base64 -d > "$GOOGLE_VISION_CREDENTIALS_PATH"
            chown dbuff:dbuff "$GOOGLE_VISION_CREDENTIALS_PATH"
            chmod 600 "$GOOGLE_VISION_CREDENTIALS_PATH"
          else
            GOOGLE_VISION_CREDENTIALS_PATH=""
          fi

          # Download JAR from S3
          aws s3 cp s3://dbuff-deploy-${AWS::AccountId}/server.jar /opt/dbuff/server.jar
          chown dbuff:dbuff /opt/dbuff/server.jar

          # Create systemd service
          cat > /etc/systemd/system/dbuff.service <<EOF
          [Unit]
          Description=DBuff Application
          After=network.target postgresql.service
          Requires=postgresql.service

          [Service]
          Type=simple
          User=dbuff
          WorkingDirectory=/opt/dbuff
          ExecStart=/usr/bin/java --enable-preview -Xms256m -Xmx512m -jar /opt/dbuff/server.jar
          Restart=on-failure
          RestartSec=10
          StandardOutput=append:/var/log/dbuff/dbuff.log
          StandardError=append:/var/log/dbuff/dbuff.log

          Environment=SPRING_PROFILES_ACTIVE=prod
          Environment=DB_HOST=localhost
          Environment=DB_PORT=5432
          Environment=DB_PASSWORD=${DbPassword}
          Environment=DOTA_API_KEY=$DOTA_API_KEY
          Environment=SCRAPPER_API_KEY=$SCRAPPER_API_KEY
          Environment=OPENAI_API_KEY=$OPENAI_API_KEY
          Environment=DISCORD_BOT_TOKEN=$DISCORD_BOT_TOKEN
          Environment=GOOGLE_VISION_CREDENTIALS_PATH=$GOOGLE_VISION_CREDENTIALS_PATH

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable dbuff
          systemctl start dbuff
      Tags:
        - Key: Name
          Value: dbuff-instance

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref AppInstance
      AllocationId: !GetAtt ElasticIP.AllocationId

  # ---------- CloudWatch ----------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/ec2/dbuff
      RetentionInDays: 30

# ---------- Outputs ----------
Outputs:
  PublicIP:
    Description: EC2 public IP address
    Value: !Ref ElasticIP

  AppUrl:
    Description: Application URL
    Value: !Sub 'http://${ElasticIP}:8080'

  S3Bucket:
    Description: S3 bucket for deployment artifacts
    Value: !Sub 'dbuff-deploy-${AWS::AccountId}'

  HealthCheckUrl:
    Description: Health check endpoint
    Value: !Sub 'http://${ElasticIP}:8080/actuator/health'
