      type: object
      description: "The stored analysis as one JSON document, keyed by section name in the order run, roles, fights, vision, runes, lanes, items, outliers, behaviour, endgame. Only the requested sections are present. Empty sections are empty lists, never absent. Nested field lists follow the reader record classes in service/replay/read; null columns are omitted from the JSON."
