openapi: 3.0.3
info:
  title: DBuff API
  description: |
    DBuff is a Dota 2 analytics backend that fetches, analyzes, and stores match data
    using the OpenDota API and parsed replays. It provides endpoints for player statistics,
    item and ability rankings, match history, match reports, replay analysis and the
    registration of Discord instances. Works as pet project only for limited player ids.

    Authentication: every path except GET /actuator/health requires the X-Api-Key header
    (see the ApiKeyAuth security scheme). The key is not required locally: with
    app.api.required=false and no DBUFF_API_KEY set the API runs open. In production a
    missing key on the server closes the API, so every request answers 401.

    Serialisation: null fields are omitted from every response, so a field listed in a
    schema may be absent. Dates are ISO-8601 strings.
  version: 1.0.0
  contact:
    name: kozlovsky.anton@gmail.com

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://{host}
    description: Production placeholder, replace the host with the deployed one
    variables:
      host:
        default: dbuff.example.com
        description: Host name of the production deployment

security:
  - ApiKeyAuth: []

tags:
  - name: Players
    description: Player management and listing
  - name: Player Statistics
    description: Aggregated player statistics and rankings
  - name: Matches
    description: Match parsing, processing, reports and AI analysis
  - name: Replay
    description: Replay run status, the stored replay analysis and re-running the analyzers
  - name: Register
    description: Registration and settings of Discord instances (tracked players, game modes)
  - name: History
    description: Match history fetching and processing
  - name: Search
    description: Player search by name, external player statistics
  - name: Image
    description: Scoreboard image recognition and statistics from it
  - name: Health
    description: Liveness, the only unauthenticated path

paths:
  /actuator/health:
    get:
      tags: [Health]
      summary: Health check
      description: The only path that does not need X-Api-Key. The deploy gate and rollback poll it.
      operationId: health
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP

  /api/v1/players/:
    get:
      tags: [Players]
      summary: List all players
      description: Returns a paginated list of all players in the database
      operationId: listPlayers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPlayerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/player/{playerId}/itemRanking:
    get:
      tags: [Player Statistics]
      summary: Get item rankings for a player
      description: |
        Returns items ordered by pick count descending. With no items filter the top items by
        pick count are returned. A limit below 1 falls back to the default.
      operationId: getItemRanking
      parameters:
        - $ref: '#/components/parameters/PlayerIdParam'
        - $ref: '#/components/parameters/StartDateParam'
        - $ref: '#/components/parameters/EndDateParam'
        - name: items
          in: query
          description: Item dnames to include
          required: false
          schema:
            type: array
            items:
              type: string
        - name: excludedItems
          in: query
          description: Item dnames to exclude
          required: false
          schema:
            type: array
            items:
              type: string
        - $ref: '#/components/parameters/HeroesParam'
        - $ref: '#/components/parameters/GameModesParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemRankingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/player/{playerId}/abilityRanking:
    get:
      tags: [Player Statistics]
      summary: Get ability rankings for a player
      description: |
        Returns abilities ordered by pick count descending. With no abilities filter the top
        abilities by pick count are returned. A limit below 1 falls back to the default.
      operationId: getAbilityRanking
      parameters:
        - $ref: '#/components/parameters/PlayerIdParam'
        - $ref: '#/components/parameters/StartDateParam'
        - $ref: '#/components/parameters/EndDateParam'
        - name: abilities
          in: query
          description: Ability names to include
          required: false
          schema:
            type: array
            items:
              type: string
        - name: excludedAbilities
          in: query
          description: Ability names to exclude
          required: false
          schema:
            type: array
            items:
              type: string
        - $ref: '#/components/parameters/HeroesParam'
        - $ref: '#/components/parameters/GameModesParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbilityRankingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/player/{playerId}/statistic:
    get:
      tags: [Player Statistics]
      summary: Get aggregated player statistics
      description: |
        Popular heroes, average/max/min of the main metrics, wins and losses, ward and
        objective statistics for the date range. Without startDate the whole history is
        included; without endDate the current date is used.
      operationId: getPlayerStatistics
      parameters:
        - $ref: '#/components/parameters/PlayerIdParam'
        - $ref: '#/components/parameters/StartDateParam'
        - $ref: '#/components/parameters/EndDateParam'
        - name: heroLimit
          in: query
          description: Number of popular heroes to return; below 1 falls back to the default
          required: false
          schema:
            type: integer
            default: 3
        - $ref: '#/components/parameters/HeroesParam'
        - $ref: '#/components/parameters/GameModesParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStatisticResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/player/{playerId}/statistic/persist:
    post:
      tags: [Player Statistics]
      summary: Persist player statistics
      description: Persists player statistics for a date range for weekly/monthly comparisons
      operationId: persistPlayerStatistics
      parameters:
        - $ref: '#/components/parameters/PlayerIdParam'
        - name: startDate
          in: query
          description: Start date of the period
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: End date of the period
          required: true
          schema:
            type: string
            format: date
        - name: heroLimit
          in: query
          description: Number of popular heroes to include
          required: false
          schema:
            type: integer
            default: 3
      responses:
        '201':
          description: Statistics persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStatisticSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/player/{playerId}/statistic/persist/weekly:
    post:
      tags: [Player Statistics]
      summary: Persist weekly statistics
      description: Calculates and persists statistics for the last 7 days
      operationId: persistWeeklyStatistics
      parameters:
        - $ref: '#/components/parameters/PlayerIdParam'
      responses:
        '201':
          description: Weekly statistics persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStatisticSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/player/{playerId}/statistic/history:
    get:
      tags: [Player Statistics]
      summary: Get persisted statistics history
      description: Returns all persisted statistics summaries for a player, newest start date first
      operationId: getPersistedStatistics
      parameters:
        - $ref: '#/components/parameters/PlayerIdParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerStatisticSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/player/{playerId}/statistic/history/range:
    get:
      tags: [Player Statistics]
      summary: Get persisted statistics in date range
      description: Returns persisted statistics summaries within a date range
      operationId: getPersistedStatisticsInRange
      parameters:
        - $ref: '#/components/parameters/PlayerIdParam'
        - name: startDate
          in: query
          description: Start date to search from
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: End date to search to
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerStatisticSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/matches/{id}:
    get:
      tags: [Matches]
      summary: Get a stored match
      description: The match with its player statistics, items, abilities, kill log and AI analysis
      operationId: getMatch
      parameters:
        - $ref: '#/components/parameters/MatchIdParam'
      responses:
        '200':
          description: The match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The match is not stored
    delete:
      tags: [Matches]
      summary: Delete a match
      description: |
        Deletes the match and its player statistics, items, abilities and analysis (unless the
        analysis is shared with other matches). An unknown match raises EntityNotFoundException,
        which no handler maps, so it surfaces as a 500 error.
      operationId: deleteMatch
      parameters:
        - $ref: '#/components/parameters/MatchIdParam'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The match does not exist (unmapped EntityNotFoundException) or deletion failed

  /api/v1/matches/{id}/parse:
    post:
      tags: [Matches]
      summary: Parse a match
      description: Fetches and parses match details from the OpenDota API and returns what was stored
      operationId: parseMatch
      parameters:
        - name: id
          in: path
          description: Match ID, parsed as a long
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Match parsed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/matches/{id}/report:
    get:
      tags: [Matches]
      summary: Get the match report of an instance
      description: Runs the report analyzers of the instance over a stored match
      operationId: getMatchReport
      parameters:
        - $ref: '#/components/parameters/MatchIdParam'
        - $ref: '#/components/parameters/InstanceIdQuery'
        - name: playerIds
          in: query
          description: Keep per-player reports of these players only; reports that are not per-player are always kept
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
      responses:
        '200':
          description: The reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The instance or the match is unknown

  /api/v1/matches/processLast:
    post:
      tags: [Matches]
      summary: Process last matches of an instance
      description: Fetches and processes the recent matches of the instance players
      operationId: processLastMatches
      parameters:
        - $ref: '#/components/parameters/InstanceIdQuery'
        - $ref: '#/components/parameters/EnableAiParam'
      responses:
        '200':
          description: IDs of the matches that were fetched
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The instance is unknown

  /api/v1/matches/processAll:
    post:
      tags: [Matches]
      summary: Process last matches of all active instances
      description: Starts processing for every active instance and returns at once
      operationId: processAllInstances
      parameters:
        - $ref: '#/components/parameters/EnableAiParam'
      responses:
        '202':
          description: Processing started
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/matches/analyze:
    post:
      tags: [Matches]
      summary: Analyze matches with AI
      description: |
        Runs the AI analysis for an instance over processed matches (those with player
        statistics). Unknown or unprocessed match IDs, and entries that are not numbers, are
        skipped; with nothing left the response is an empty list. If both fieldConfig and
        preset are sent, fieldConfig wins.
      operationId: analyzeMatches
      parameters:
        - $ref: '#/components/parameters/InstanceIdQuery'
        - name: matches
          in: query
          description: Comma-separated match IDs
          required: true
          schema:
            type: string
            example: 9038725154,9037038717
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeMatchesRequest'
      responses:
        '200':
          description: The analysis results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchAnalysisDomain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The instance is unknown

  /api/v1/matches/findIncompleted:
    get:
      tags: [Matches]
      summary: Find incomplete matches
      description: Checks every stored match and lists those with missing data. Walks all matches, so it can be slow.
      operationId: findIncompletedMatches
      responses:
        '200':
          description: One single-key object per incomplete match, match ID mapped to what is missing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncompleteMatchEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/matches/findIncompletedAndFix:
    post:
      tags: [Matches]
      summary: Find incomplete matches and process them again
      description: Same check as findIncompleted, then processes every incomplete match. Returns the list found before fixing.
      operationId: findIncompletedMatchesAndFix
      responses:
        '200':
          description: The incomplete matches that were reprocessed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncompleteMatchEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/replay/{matchId}:
    get:
      tags: [Replay]
      summary: Replay run status
      description: How the replay run of the match ended, for the current parser version
      operationId: getReplayRun
      parameters:
        - $ref: '#/components/parameters/ReplayMatchIdParam'
      responses:
        '200':
          description: The run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No run is stored for the match

  /api/v1/replay/{matchId}/analysis:
    get:
      tags: [Replay]
      summary: Stored replay analysis
      description: |
        The stored analysis of a match as one JSON document, read from the tables only, in one
        snapshot. The sections are run, roles, fights, vision, runes, lanes, items, outliers,
        behaviour and endgame; all are returned when sections is absent. Roles, runes, lanes
        and behaviour are objects of lists, the others are lists; the fields are those of the
        reader records in service/replay/read.
      operationId: getReplayAnalysis
      parameters:
        - $ref: '#/components/parameters/ReplayMatchIdParam'
        - name: sections
          in: query
          description: Comma-separated section names; an empty entry or an unknown name gives 400
          required: false
          schema:
            type: string
            example: roles,fights
      responses:
        '200':
          description: The requested sections, keyed by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayAnalysis'
        '400':
          description: Empty entry or unknown section; the message lists the valid sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No replay run of the match is stored (empty body)

  /api/v1/replay/{matchId}/reanalyze:
    post:
      tags: [Replay]
      summary: Re-run the analyzers for one match
      description: |
        Runs every analyzer again from the stored data, no replay needed. Only runs with status
        DONE qualify. One re-analysis runs at a time across this and the bulk endpoint.
      operationId: reanalyzeMatch
      parameters:
        - $ref: '#/components/parameters/ReplayMatchIdParam'
      responses:
        '200':
          description: Analyzed; failedAnalyzers lists the analyzers that failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  matchId:
                    type: integer
                    format: int64
                  failedAnalyzers:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No run stored for the match, or its status is not DONE (empty body)
        '409':
          description: The match is not stored or its game mode is not active for replay processing, or a re-analysis is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/v1/replay/reanalyze:
    post:
      tags: [Replay]
      summary: Re-run the analyzers in bulk
      description: |
        Runs every analyzer again for finished (DONE) runs of matches with an ID above after,
        oldest first, up to limit. Call again with after set to lastMatchId to continue. Runs
        whose game mode is not active are skipped.
      operationId: reanalyzeMatches
      parameters:
        - name: limit
          in: query
          description: Maximum runs to process
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
        - name: after
          in: query
          description: Process only matches with an ID greater than this
          required: false
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '200':
          description: Counts of the batch
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysed:
                    type: integer
                    description: Runs analysed
                  available:
                    type: integer
                    description: DONE runs of the parser version, before the after and limit cut
                  withFailures:
                    type: integer
                    description: Analysed runs where an analyzer failed or threw
                  skipped:
                    type: integer
                    description: Runs skipped because the game mode is not active
                  lastMatchId:
                    type: integer
                    format: int64
                    description: Last match ID reached, to pass as after; equals after when nothing was left
        '400':
          description: limit outside 1 to 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A re-analysis is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/v1/register:
    post:
      tags: [Register]
      summary: Register an instance
      description: |
        Creates an instance configuration. A deactivated instance on the same Discord channel is
        brought back instead of rejected. Game modes are names, numeric IDs or "all".
      operationId: registerInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInstanceRequest'
      responses:
        '201':
          description: The created instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbufInstanceConfigResponse'
        '400':
          description: No player IDs, or an unknown game mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The Discord channel already has an active instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Registration failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Register]
      summary: List active instances
      operationId: listInstances
      responses:
        '200':
          description: Active instance configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DbufInstanceConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/register/{id}:
    get:
      tags: [Register]
      summary: Get an instance
      operationId: getInstance
      parameters:
        - $ref: '#/components/parameters/InstanceIdPath'
      responses:
        '200':
          description: The instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbufInstanceConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The instance is unknown
    patch:
      tags: [Register]
      summary: Update an instance
      description: Adds or removes players and game modes, renames, activates or deactivates, and changes the per-channel settings
      operationId: updateInstance
      parameters:
        - $ref: '#/components/parameters/InstanceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstanceRequest'
      responses:
        '200':
          description: The updated instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbufInstanceConfigResponse'
        '400':
          description: Unknown instance or invalid value, such as an unknown game mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Register]
      summary: Delete an instance
      operationId: deleteInstance
      parameters:
        - $ref: '#/components/parameters/InstanceIdPath'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/register/{id}/deactivate:
    post:
      tags: [Register]
      summary: Deactivate an instance
      description: Marks the instance inactive and unschedules its jobs; an unknown ID is ignored
      operationId: deactivateInstance
      parameters:
        - $ref: '#/components/parameters/InstanceIdPath'
      responses:
        '204':
          description: Deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/history/processAll:
    post:
      tags: [History]
      summary: Process the match history of an instance
      description: |
        Loads the complete history of every player of the instance in the background, for the
        game modes of the instance, and returns at once.
      operationId: processAllHistory
      parameters:
        - $ref: '#/components/parameters/InstanceIdQuery'
        - name: startPage
          in: query
          description: Starting page number
          required: false
          schema:
            type: integer
            default: 0
        - name: endPage
          in: query
          description: Ending page number (-1 for all pages)
          required: false
          schema:
            type: integer
            default: -1
      responses:
        '202':
          description: Processing started
        '400':
          description: The instance is not active
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The instance is unknown

  /api/v1/findPlayer/{playerName}:
    get:
      tags: [Search]
      summary: Find player matches by name
      description: |
        Matches where the player took part, newest first, each with statistics of the searched
        player and the instance players. An unknown player or instance gives an empty list.
      operationId: findPlayerMatches
      parameters:
        - name: playerName
          in: path
          description: Player name to search for
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/InstanceIdQuery'
        - name: limit
          in: query
          description: Maximum matches; below 1 falls back to the default
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FindPlayerMatchesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/externalPlayerStatistic:
    get:
      tags: [Search]
      summary: Statistics against or with an external player
      description: |
        Games where the focus group played with or against the named player. The focus group
        comes from instance_id when given, otherwise from focus_player_ids (empty when neither
        is sent).
      operationId: getExternalPlayerStatistic
      parameters:
        - name: instance_id
          in: query
          description: Instance whose players are the focus group
          required: false
          schema:
            type: string
        - name: focus_player_ids
          in: query
          description: Focus group player IDs, used only when instance_id is absent
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: player_name
          in: query
          description: The external player's name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The statistics; empty when the player is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalPlayerStatisticResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/image/players:
    post:
      tags: [Image]
      summary: Extract player names from a scoreboard image
      description: OCR over the uploaded image (Google Cloud Vision); uploads up to 20MB
      operationId: extractPlayerNames
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: The image file (PNG, JPEG, etc.)
      responses:
        '200':
          description: The detected names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedPlayerNamesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/scoreboardStatistics:
    post:
      tags: [Image]
      summary: Statistics of the opponents on a scoreboard image
      description: |
        Detects the player names on the image, drops the focus group itself and returns the
        statistics against each remaining player. The focus group comes from instance_id when
        given, otherwise from focus_player_ids. The two text fields are read as request
        parameters, so they may be sent as form fields or in the query string.
      operationId: getScoreboardStatistics
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: The scoreboard image
                instance_id:
                  type: string
                  description: Instance whose players are the focus group
                focus_player_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Focus group player IDs, used only when instance_id is absent
      responses:
        '200':
          description: One entry per detected opponent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalPlayerStatisticResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Required on every path except /actuator/health. Not required locally
        (app.api.required=false with an empty DBUFF_API_KEY runs open).

  responses:
    Unauthorized:
      description: Missing or wrong X-Api-Key, or the server has no key configured in production
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'

  parameters:
    PlayerIdParam:
      name: playerId
      in: path
      description: Player account ID
      required: true
      schema:
        type: integer
        format: int64
    MatchIdParam:
      name: id
      in: path
      description: Match ID
      required: true
      schema:
        type: integer
        format: int64
    ReplayMatchIdParam:
      name: matchId
      in: path
      description: Match ID
      required: true
      schema:
        type: integer
        format: int64
    InstanceIdPath:
      name: id
      in: path
      description: Instance ID
      required: true
      schema:
        type: string
    InstanceIdQuery:
      name: instanceId
      in: query
      description: Instance configuration ID
      required: true
      schema:
        type: string
    EnableAiParam:
      name: enableAi
      in: query
      description: Run the AI analysis after processing
      required: false
      schema:
        type: boolean
        default: true
    StartDateParam:
      name: startDate
      in: query
      description: Start date filter (inclusive); absent includes all history
      required: false
      schema:
        type: string
        format: date
    EndDateParam:
      name: endDate
      in: query
      description: End date filter (inclusive); absent uses the current date
      required: false
      schema:
        type: string
        format: date
    HeroesParam:
      name: heroes
      in: query
      description: Hero names to restrict the statistics to
      required: false
      schema:
        type: array
        items:
          type: string
    GameModesParam:
      name: gameModes
      in: query
      description: Game mode names to restrict the statistics to; absent includes every mode
      required: false
      schema:
        type: array
        items:
          type: string
    LimitParam:
      name: limit
      in: query
      description: Maximum number of results; below 1 falls back to the default
      required: false
      schema:
        type: integer
        default: 10
    PageParam:
      name: page
      in: query
      description: Page number (0-indexed)
      required: false
      schema:
        type: integer
        default: 0
    SizeParam:
      name: size
      in: query
      description: Page size
      required: false
      schema:
        type: integer
        default: 20
    SortParam:
      name: sort
      in: query
      description: Sort field and direction (e.g., "name,asc")
      required: false
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      description: "Error body of the register endpoints."
      properties:
        code:
          type: string
          description: "INVALID_REQUEST, CONFLICT or INTERNAL_ERROR"
        message:
          type: string
          description: "Human-readable message"
        details:
          type: string
          description: "Extra detail, present on INTERNAL_ERROR"
    ErrorMessage:
      type: object
      description: "Error body of the replay endpoints and of the API key filter (unauthorized responses carry the text Unauthorized)."
      properties:
        error:
          type: string
          description: "What went wrong"
    PlayerDomain:
      type: object
      description: "A tracked player."
      properties:
        id:
          type: integer
          format: int64
          description: "Player account ID"
        name:
          type: string
          description: "Player name (the entity key)"
        discordUserId:
          type: string
          description: "Linked Discord user ID (snowflake as a string), absent when unlinked"
    PagedPlayerResponse:
      type: object
