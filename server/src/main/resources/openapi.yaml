          description: "Section run"
          allOf:
            - $ref: '#/components/schemas/RunStatus'
        roles:
          description: "Section roles"
          allOf:
            - $ref: '#/components/schemas/RolesSection'
        fights:
          type: array
          items:
            $ref: '#/components/schemas/ImportantFight'
          description: "Section fights: important fights only"
        vision:
          type: array
          items:
            $ref: '#/components/schemas/FightVision'
          description: "Section vision"
        runes:
          description: "Section runes"
          allOf:
            - $ref: '#/components/schemas/RunesSection'
        lanes:
          description: "Section lanes"
          allOf:
            - $ref: '#/components/schemas/LanesSection'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemEfficiency'
          description: "Section items"
        outliers:
          type: array
          items:
            $ref: '#/components/schemas/Outlier'
          description: "Section outliers"
        behaviour:
          description: "Section behaviour"
          allOf:
            - $ref: '#/components/schemas/BehaviourSection'
        endgame:
          type: array
          items:
            $ref: '#/components/schemas/EndGame'
          description: "Section endgame: one entry per stored end-game summary"
