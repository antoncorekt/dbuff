# Production profile - deployed on a single AWS EC2 instance running both the
# app and PostgreSQL 16 on localhost.

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/dbuff
spring.datasource.username=dbuffuser
spring.datasource.password=${DB_PASSWORD}

# HikariCP - sized for a co-located database, not a dedicated RDS box. Every
# backend costs ~10MB of the 2GiB shared with the JVM, and postgresql.conf caps
# max_connections at 30, so the pool must stay well under that to leave room for
# psql and the backup job. Connections are cheap here (loopback, no network hop),
# so a small pool is not the bottleneck it would be against a remote database.
#
# Budget: Quartz (threadCount=5) shares this pool with HTTP/Discord request
# threads. Peak DB-touching work is bounded by the ConcurrencyConfig semaphores
# (max-parallel-matches=5 + max-parallel-pages=2), not by the Quartz thread
# count, so ~7 concurrent borrowers is the realistic ceiling. If
# "HikariPool-1 - Connection is not available" ever shows up in the logs, raise
# this before suspecting anything else - there is room up to ~20 under
# max_connections=30.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Hibernate owns the schema. Note that despite the scripts in
# db/migration/, Flyway is NOT on the classpath - it was never added as a
# dependency, so those migrations have never run and their indexes do not exist
# in any deployed database. Hibernate ddl-auto is the only schema source.
spring.jpa.hibernate.ddl-auto=update

# Hibernate batching - reduces DB round-trips
# Note: entities with GenerationType.IDENTITY (PlayerStatisticSummaryDomain,
# MatchAnalysisDomain) won't batch — migrate to SEQUENCE for full benefit.
spring.jpa.properties.hibernate.jdbc.batch_size=25

# Logging - production levels
logging.level.root=INFO
logging.level.com.ako.dbuff=INFO
logging.level.org.springframework.cache=WARN
logging.level.com.ako.dbuff.config=INFO

# Actuator health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Scrapper configuration
scrapper.enabled=true
scrapper.provider=scraperapi
scrapper.is-debug-enabled=false
dota-api.is-debug-enabled=false

# Lower concurrency to avoid OpenDota API rate-limiting/SSL drops
app.concurrency.max-parallel-matches=5
app.concurrency.max-parallel-pages=2

# Stricter rate limiting for external APIs
dota-api.request-per-minute=30
scrapper.request-per-minute=30
