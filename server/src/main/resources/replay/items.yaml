# First guesses, tuned in the review loop (docs/replay-item-loop/README.md).
prices: {}
alternatives: {}
categories:
  farming: Farming
  sustain: Sustain and mana
entries:
  - key: magic_stick
    category: sustain
    items: [magic_stick, magic_wand]
    aspects: [charge-restore, save]
    parameters:
      restorePerCharge: 15
      goldPerHp: 0.3
      goldPerMana: 0.3
      saveGold: 300
      laningEndSeconds: 600
      lowHpFraction: 0.35
      lowHpAbsolute: 300
      heavyDamageFraction: 0.3
      heavyDamageAbsolute: 300
      damageBeforeSeconds: 3
      damageAfterSeconds: 3
      surviveSeconds: 10
      hpLookbackSeconds: 3
      maxHpWindowSeconds: 120
  - key: hand_of_midas
    category: farming
    items: [hand_of_midas]
    aspects: [midas-uses]
    parameters:
      cooldownSeconds: 90
      xpWeight: 1
      includeAttackSpeed: 1
  - key: farming_items
    category: farming
    items: [bfury, maelstrom, mjollnir]
    aspects: [farm-rate, item-damage, stat-uplift]
    parameters:
      windowMinutes: 5
      minBeforeSeconds: 120
      minAfterSeconds: 60
      campGapSeconds: 30
      damagePrice: 100
      damageWindowMinutes: 5
