# First guesses, tuned in the review loop (docs/replay-item-loop/README.md).
prices:
  killWindowSeconds: 10
  xpWeight: 1
  pokePrice: 0.02
  disableShare: 0.25
  trendMinutes: 8
  respawnSeconds: 30
alternatives: { altCostBand: 0.3, altTimeBand: 300, altMinGames: 5 }
categories:
  farming: Farming
  sustain: Sustain and mana
entries:
  - key: magic_stick
    category: sustain
    items: [magic_stick, magic_wand]
    aspects: [charge-restore, save]
    parameters:
      restorePerCharge: 15
      goldPerHp: 0.3
      goldPerMana: 0.3
      laningEndSeconds: 600
      lowHpFraction: 0.35
      lowHpAbsolute: 300
      heavyDamageFraction: 0.3
      heavyDamageAbsolute: 300
      damageBeforeSeconds: 3
      damageAfterSeconds: 3
      surviveSeconds: 10
      hpLookbackSeconds: 3
      maxHpWindowSeconds: 120
  - key: hand_of_midas
    category: farming
    items: [hand_of_midas]
    aspects: [midas-uses]
    winStats: [[hand_of_midas], [hand_of_midas, octarine_core]]
    parameters:
      cooldownSeconds: 90
      xpWeight: 1
      includeAttackSpeed: 1
  - key: farming_items
    category: farming
    items: [bfury, maelstrom, mjollnir]
    aspects: [farm-rate, item-damage, stat-uplift, alternatives]
    parameters:
      windowMinutes: 5
      minBeforeSeconds: 120
      minAfterSeconds: 60
      campGapSeconds: 30
      damageWindowMinutes: 5
  - key: radiance
    category: farming
    items: [radiance]
    aspects: [farm-rate, item-damage, alternatives]
    alternatives: [maelstrom, bfury, manta]
    parameters:
      windowMinutes: 5
      minBeforeSeconds: 120
      minAfterSeconds: 60
      campGapSeconds: 30
      damageWindowMinutes: 5
