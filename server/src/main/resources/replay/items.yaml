# First guesses, tuned in the review loop (docs/replay-item-loop/README.md).
prices:
  killWindowSeconds: 10
  xpWeight: 1
  pokePrice: 0.02
  disableShare: 0.25
  trendMinutes: 8
  respawnSeconds: 30
alternatives: { altCostBand: 0.3, altTimeBand: 300, altMinGames: 5 }
categories:
  farming: Farming
  sustain: Sustain and mana
  save: Saves
entries:
  - key: magic_stick
    category: sustain
    items: [magic_stick, magic_wand]
    aspects: [charge-restore, save]
    parameters:
      restorePerCharge: 15
      goldPerHp: 0.3
      goldPerMana: 0.3
      laningEndSeconds: 600
      lowHpFraction: 0.35
      lowHpAbsolute: 300
      heavyDamageFraction: 0.3
      heavyDamageAbsolute: 300
      damageBeforeSeconds: 3
      damageAfterSeconds: 3
      surviveSeconds: 10
      hpLookbackSeconds: 3
      maxHpWindowSeconds: 120
  - key: hand_of_midas
    category: farming
    items: [hand_of_midas]
    aspects: [midas-uses]
    winStats: [[hand_of_midas], [hand_of_midas, octarine_core]]
    parameters:
      cooldownSeconds: 90
      xpWeight: 1
      includeAttackSpeed: 1
  - key: farming_items
    category: farming
    items: [bfury, maelstrom, mjollnir]
    aspects: [farm-rate, item-damage, stat-uplift, alternatives]
    parameters:
      windowMinutes: 5
      minBeforeSeconds: 120
      minAfterSeconds: 60
      campGapSeconds: 30
      damageWindowMinutes: 5
  - key: radiance
    category: farming
    items: [radiance]
    aspects: [farm-rate, item-damage, alternatives, saving-cost]
    alternatives: [maelstrom, bfury, manta]
    parameters:
      windowMinutes: 5
      minBeforeSeconds: 120
      minAfterSeconds: 60
      campGapSeconds: 30
      damageWindowMinutes: 5
      savingThreshold: 0.4
      smallPurchase: 500
  - key: octarine_core
    category: farming
    items: [octarine_core]
    aspects: [cooldown, alternatives]
    parameters:
      damageSeconds: 3
      toleranceSeconds: 0.5
  - key: bottle
    category: sustain
    items: [bottle]
    aspects: [bottle-runes, charge-restore]
    parameters:
      restoreFromConstants: 1
      goldPerHp: 0.3
      goldPerMana: 0.3
      laningEndSeconds: 600
      lowHpFraction: 0.35
      lowHpAbsolute: 300
      heavyDamageFraction: 0.3
      heavyDamageAbsolute: 300
      damageBeforeSeconds: 3
      damageAfterSeconds: 3
      surviveSeconds: 10
      hpLookbackSeconds: 3
      maxHpWindowSeconds: 120
      healWindowSeconds: 4
  - key: arcane_boots
    category: sustain
    items: [arcane_boots]
    aspects: [team-restore]
  - key: mekansm
    category: sustain
    items: [mekansm, guardian_greaves]
    aspects: [team-restore, save]
  - key: holy_locket
    category: sustain
    items: [holy_locket]
    aspects: [team-restore, save]
  - key: soul_ring
    category: sustain
    items: [soul_ring]
    aspects: [self-harm, charge-restore]
    parameters:
      healthCost: 170
      goldPerHp: 0.3
      goldPerMana: 0.3
      laningEndSeconds: 600
      surviveSeconds: 10
      hpLookbackSeconds: 3
      maxHpWindowSeconds: 120
  - key: glimmer_cape
    category: save
    items: [glimmer_cape]
    aspects: [target-use, save]
  - key: force_staff
    category: save
    items: [force_staff]
    aspects: [target-use, save, control]
  - key: lotus_orb
    category: save
    items: [lotus_orb]
    aspects: [target-use, save]
  - key: euls_scepter
    category: save
    items: [cyclone]
    aspects: [target-use, save, control]
  - key: solar_crest
    category: save
    items: [solar_crest]
    aspects: [target-use, save, control]
